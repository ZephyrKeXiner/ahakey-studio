[package]
name = "ahakey-studio"
default-run = "ahakey-studio"
version = "0.1.0"
description = "Desktop companion for AhaKey Runtime"
authors = ["AhaKey"]
license = "Apache-2.0"
edition = "2024"

[lib]
name = "ahakey_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "net", "time", "macros", "rt-multi-thread", "sync", "process", "signal"] }
tokio-tungstenite = "0.28"
url = "2"

sha2 = "0.10"
uuid = "1"

fs2 = "0.4"
libc = "0.2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
