name: Studio Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Rebuild an existing tag with current packaging tools; leave empty for a preview'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      ci_passed: ${{ steps.ci.outputs.passed }}
      version: ${{ steps.metadata.outputs.version }}
      runtime_repository: ${{ steps.metadata.outputs.runtime_repository }}
      runtime_revision: ${{ steps.metadata.outputs.runtime_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release source
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$MANUAL_RELEASE_TAG"
          if [[ -z "$tag" && "$REF_TYPE" == tag ]]; then tag="$REF_NAME"; fi
          args=()
          commit=$(git rev-parse HEAD)
          if [[ -n "$tag" ]]; then
            commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            args+=(--tag "$tag")
          fi
          git worktree add --detach "$RUNNER_TEMP/release-source" "$commit"
          python3 scripts/release-metadata.py --root "$RUNNER_TEMP/release-source" --github-output "${args[@]}"
          echo "source_sha=$commit" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Reuse successful CI for this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ steps.metadata.outputs.source_sha }}
        run: |
          passed=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&branch=main&status=success&per_page=1" --jq '.total_count > 0')
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  checks:
    needs: metadata
    if: needs.metadata.outputs.ci_passed != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.metadata.outputs.source_sha }}

  package:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: aarch64
          - runner: macos-15-intel
            architecture: x86_64
    defaults:
      run:
        working-directory: studio
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build-tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: studio
          ref: ${{ needs.metadata.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.metadata.outputs.runtime_repository }}
          ref: ${{ needs.metadata.outputs.runtime_revision }}
          path: ahakey-runtime-rust
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          shared-key: studio-${{ runner.arch }}
          workspaces: |
            studio/src-tauri -> target
            ahakey-runtime-rust -> target
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: npm ci && npm run build
      - run: mkdir -p src-tauri/resources/bin
      - name: Build pinned Runtime
        run: cargo build --locked --release --bins --manifest-path ../ahakey-runtime-rust/Cargo.toml
      - name: Import release signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 ../build-tools/scripts/ci-keychain.py
      - name: Build, sign and notarize complete application
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --bundles app,dmg
      - name: Verify installer and collect release asset
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_ARCH: ${{ matrix.architecture }}
        run: python3 ../build-tools/scripts/verify-release.py --root "$PWD" --version "$RELEASE_VERSION" --architecture "$RELEASE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: studio-macos-${{ matrix.architecture }}
          path: studio/dist/release/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Preserve installer for failure diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unverified-macos-${{ matrix.architecture }}
          path: studio/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 3
      - name: Remove signing material
        if: always()
        run: python3 ../build-tools/scripts/ci-keychain.py cleanup

  publish:
    if: >-
      !cancelled() && needs.metadata.outputs.release_tag != '' &&
      needs.metadata.result == 'success' && needs.package.result == 'success' &&
      (needs.checks.result == 'success' ||
       (needs.checks.result == 'skipped' && needs.metadata.outputs.ci_passed == 'true'))
    needs: [metadata, checks, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.metadata.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: build-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: studio-macos-*
          path: dist/release
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: python3 build-tools/scripts/publish-release.py --root "$PWD" --tag "$RELEASE_TAG"
